<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anand's systems lab terminal</title>
  <desc id="desc">An animated dark terminal introducing Anand, a computer science student working with Rust, systems, security, and machine learning.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#30363d"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#edge)"/>
  <path d="M0 52h1200" stroke="#30363d"/>
  <circle cx="32" cy="26" r="6" fill="#ff7b72"/><circle cx="54" cy="26" r="6" fill="#d29922"/><circle cx="76" cy="26" r="6" fill="#3fb950"/>
  <text x="600" y="31" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">anand@systems-lab: ~</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="102" fill="#3fb950" font-size="18">$</text><text x="88" y="102" fill="#c9d1d9" font-size="18">whoami</text>
    <text x="62" y="151" fill="#79c0ff" font-size="38" font-weight="700">ANAND</text>
    <text x="62" y="181" fill="#8b949e" font-size="16">computer science student · systems-minded builder</text>
    <text x="62" y="227" fill="#3fb950" font-size="18">$</text><text x="88" y="227" fill="#c9d1d9" font-size="18">focus --current</text>
    <text x="62" y="259" fill="#d2a8ff" font-size="16">Rust  ·  C++  ·  Linux / Neovim  ·  Security  ·  ML</text>
    <text x="62" y="305" fill="#3fb950" font-size="18">$</text><text x="88" y="305" fill="#c9d1d9" font-size="18">_</text>
    <rect x="101" y="289" width="10" height="22" fill="#79c0ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g opacity=".5" fill="#58a6ff">
    <circle cx="1090" cy="107" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1132" cy="149" r="2"><animate attributeName="opacity" values="1;.1;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1066" cy="205" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
